<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Yêu cầu Bảo hành - Smart CRM</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h2 {
            font-size: 22px;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .nav-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 8px;
            align-items: center;
        }
        .nav-bar span { font-weight: 600; font-size: 14px; color: #64748b; }
        .nav-bar a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-bar a:hover {
            background: #e0e7ff;
            color: var(--primary-hover);
        }

        .filter-container {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            align-items: end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #64748b; }
        .btn-secondary:hover { background-color: #475569; }

        .table-responsive {
            overflow-x: auto;
            margin-top: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #334155;
        }
        tr:hover { background-color: #f8fafc; }

        .state-box {
            padding: 32px;
            text-align: center;
            background: #f8fafc;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin-top: 16px;
            color: #64748b;
            font-size: 15px;
        }
        .error-msg {
            color: #dc2626;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .footer-uc {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Màn hình 1: Danh sách yêu cầu bảo hành</h2>

        <div class="nav-bar">
            <span>QUẢN LÝ BẢO HÀNH:</span>
            <a href="ticket-list.html">Danh sách</a>
            <a href="ticket-create.html">Tạo yêu cầu</a>
            <a href="#" onclick="logout()">Đăng xuất</a>
        </div>

        <div class="filter-container">
            <div class="filter-group">
                <label>Số điện thoại khách hàng</label>
                <input type="text" id="filterPhone" placeholder="Nhập số điện thoại...">
            </div>
            <div class="filter-group">
                <label>Trạng thái</label>
                <select id="filterStatus">
                    <option value="">Tất cả trạng thái</option>
                    <option value="MOI_TIEP_NHAN">Mới tiếp nhận</option>
                    <option value="DANG_XU_LY">Đang xử lý</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Mức ưu tiên</label>
                <select id="filterPriority">
                    <option value="">Tất cả mức độ</option>
                    <option value="CAO">Cao</option>
                    <option value="TRUNG_BINH">Trung bình</option>
                    <option value="THAP">Thấp</option>
                </select>
            </div>
            <div class="filter-actions">
                <button class="btn" onclick="loadTickets()">Tìm kiếm</button>
                <button class="btn btn-secondary" onclick="resetFilter()">Làm mới</button>
            </div>
        </div>

        <div id="contentArea"></div>

        <div class="footer-uc">Use Case: UC07 - Xem trạng thái yêu cầu bảo hành</div>
    </div>

<script type="module">
    import { getTickets } from '../api/ticket.api.js';

    let selectedTicketId = null;

    window.loadTickets = async function() {
        const contentArea = document.getElementById('contentArea');
        const phone = document.getElementById('filterPhone').value.trim();
        const status = document.getElementById('filterStatus').value;
        const priority = document.getElementById('filterPriority').value;

        contentArea.innerHTML = '<div class="state-box">Đang tải danh sách yêu cầu bảo hành...</div>';

        try {
            const filters = {};
            if (phone) filters.phone = phone;
            if (status) filters.status = status;
            if (priority) filters.priority = priority;

            const res = await getTickets(filters);
            console.log("Dữ liệu API danh sách trả về:", res);

            // Bắt linh hoạt mọi định dạng mảng trả về từ Backend
            const tickets = Array.isArray(res) 
                ? res 
                : (res.tickets || res.data || res.rows || []);

            if (tickets.length === 0) {
                contentArea.innerHTML = '<div class="state-box">Không tìm thấy yêu cầu bảo hành nào phù hợp.</div>';
                return;
            }

            let html = `
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã yêu cầu</th>
                                <th>Khách hàng</th>
                                <th>Thiết bị</th>
                                <th>Trạng thái</th>
                                <th>Ưu tiên</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            tickets.forEach(t => {
                const priorityText = t.priority === 'CAO' ? 'Cao' : (t.priority === 'TRUNG_BINH' ? 'Trung bình' : 'Thấp');
                const statusText = t.status === 'MOI_TIEP_NHAN' ? 'Mới tiếp nhận' : (t.status === 'DANG_XU_LY' ? 'Đang xử lý' : t.status);
                const ticketCode = t.ticket_id ? `YC00${t.ticket_id}` : (t.id ? `YC00${t.id}` : 'YC001');
                const tId = t.ticket_id || t.id;

                html += `
                    <tr onclick="selectRow(this, ${tId})" style="cursor:pointer;">
                        <td><strong>${ticketCode}</strong></td>
                        <td>${t.full_name || t.customer_name || 'Khách hàng'}</td>
                        <td>${t.device_name || 'Thiết bị'}</td>
                        <td><span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${statusText}</span></td>
                        <td>${priorityText}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 16px;">
                    <button class="btn" onclick="goToDetail()">Xem chi tiết phiếu đã chọn</button>
                </div>
            `;

            contentArea.innerHTML = html;

        } catch (err) {
            contentArea.innerHTML = `
                <div class="state-box">
                    <p class="error-msg">Không thể kết nối đến máy chủ API (${err.message})</p>
                    <button class="btn" onclick="loadTickets()">Thử lại</button>
                </div>
            `;
        }
    };

    window.selectRow = function(row, id) {
        document.querySelectorAll('tr').forEach(r => r.style.backgroundColor = '');
        row.style.backgroundColor = '#eff6ff';
        selectedTicketId = id;
    };

    window.goToDetail = function() {
        if (!selectedTicketId) {
            alert('Vui lòng chọn một hàng trong bảng danh sách trước!');
            return;
        }
        window.location.href = `ticket-detail.html?id=${selectedTicketId}`;
    };

    window.resetFilter = function() {
        document.getElementById('filterPhone').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterPriority').value = '';
        loadTickets();
    };

    window.logout = function() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    };

    loadTickets();
</script>
</body>
</html>
