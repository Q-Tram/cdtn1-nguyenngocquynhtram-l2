<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình 3: Chi tiết yêu cầu bảo hành - Smart CRM</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h2 {
            font-size: 22px;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            text-align: center;
        }

        /* Thanh điều hướng */
        .nav-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 8px;
            align-items: center;
        }
        .nav-bar span { font-weight: 600; font-size: 14px; color: #64748b; }
        .nav-bar a {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-bar a:hover {
            background: #e0e7ff;
            color: var(--primary-hover);
        }

        .detail-section {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .detail-section h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 160px 1fr;
            row-gap: 10px;
            font-size: 14px;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
        }

        .info-value {
            color: var(--text-main);
        }

        /* Bảng lịch sử trạng thái */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            margin-top: 10px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
        }
        th {
            background-color: #f1f5f9;
            font-weight: 600;
            color: #334155;
        }

        /* Nút bấm chung */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }

        /* Khung trạng thái (Loading, Empty, Error) */
        .state-box {
            padding: 32px;
            text-align: center;
            background: #f8fafc;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin-top: 16px;
            color: #64748b;
            font-size: 15px;
        }
        .error-msg {
            color: #dc2626;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .footer-uc {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>MÀN HÌNH 3 - CHI TIẾT YÊU CẦU BẢO HÀNH</h2>

        <div class="nav-bar">
            <span>QUẢN LÝ BẢO HÀNH:</span>
            <a href="ticket-list.html">[Danh sách]</a>
            <a href="ticket-create.html">[Tạo yêu cầu]</a>
            <a href="#" onclick="logout()">[Đăng xuất]</a>
        </div>

        <!-- Khung hiển thị Trạng thái (Loading / Empty / Error / Success) -->
        <div id="contentArea"></div>

        <div class="footer-uc">Use Case: UC07 - Xem trạng thái yêu cầu bảo hành</div>
    </div>

<script type="module">
    import { getTicketDetail } from '../api/ticket.api.js';

    window.loadDetail = async function() {
        const contentArea = document.getElementById('contentArea');
        const urlParams = new URLSearchParams(window.location.search);
        const ticketId = urlParams.get('id') || 1; // Lấy ID từ URL (mặc định 1 nếu không truyền)

        // 1. Trạng thái Đang tải (Loading)
        contentArea.innerHTML = '<div class="state-box">Đang tải thông tin chi tiết yêu cầu bảo hành...</div>';

        try {
            const res = await getTicketDetail(ticketId);
            const ticket = res.ticket || res;
            const logs = res.logs || ticket.logs || [];

            // 2. Trạng thái Rỗng (Empty)
            if (!ticket || !ticket.ticket_id) {
                contentArea.innerHTML = '<div class="state-box">Không tìm thấy thông tin phiếu bảo hành yêu cầu.</div>';
                return;
            }

            // Chuẩn hóa hiển thị dữ liệu theo Wireframe BT1
            const statusText = ticket.status === 'MOI_TIEP_NHAN' ? 'Mới tiếp nhận' : (ticket.status === 'DANG_XU_LY' ? 'Đang xử lý' : ticket.status);
            const priorityText = ticket.priority === 'CAO' ? 'Cao' : (ticket.priority === 'TRUNG_BINH' ? 'Trung bình' : 'Thấp');

            // 3. Trạng thái Thành công (Success)
            let html = `
                <!-- Thông tin phiếu -->
                <div class="detail-section">
                    <h3>Chi tiết yêu cầu: YC00${ticket.ticket_id}</h3>
                    <div class="info-grid">
                        <div class="info-label">Trạng thái:</div>
                        <div class="info-value"><strong>${statusText}</strong></div>
                        <div class="info-label">Ngày tiếp nhận:</div>
                        <div class="info-value">${ticket.created_at ? new Date(ticket.created_at).toISOString().split('T')[0] : 'N/A'}</div>
                        <div class="info-label">Mức ưu tiên:</div>
                        <div class="info-value">${priorityText}</div>
                        <div class="info-label">Hạn cam kết:</div>
                        <div class="info-value">${ticket.due_date ? new Date(ticket.due_date).toISOString().split('T')[0] : 'N/A'}</div>
                    </div>
                </div>

                <!-- Khách hàng -->
                <div class="detail-section">
                    <h3>Khách hàng</h3>
                    <div class="info-grid">
                        <div class="info-label">Họ tên:</div>
                        <div class="info-value">${ticket.full_name || 'N/A'}</div>
                        <div class="info-label">Số điện thoại:</div>
                        <div class="info-value">${ticket.phone || 'N/A'}</div>
                    </div>
                </div>

                <!-- Thiết bị và sự cố -->
                <div class="detail-section">
                    <h3>Thiết bị và sự cố</h3>
                    <div class="info-grid">
                        <div class="info-label">Tên thiết bị:</div>
                        <div class="info-value">${ticket.device_name || 'N/A'}</div>
                        <div class="info-label">Serial/IMEI:</div>
                        <div class="info-value">${ticket.serial_number || 'N/A'}</div>
                        <div class="info-label">Ngày mua:</div>
                        <div class="info-value">${ticket.purchase_date ? new Date(ticket.purchase_date).toISOString().split('T')[0] : 'N/A'}</div>
                        <div class="info-label">Nhóm sự cố:</div>
                        <div class="info-value">${ticket.category_name || (ticket.category_id === 1 ? 'Phần cứng' : 'Phần mềm')}</div>
                        <div class="info-label">Mô tả lỗi:</div>
                        <div class="info-value">${ticket.issue_desc || 'N/A'}</div>
                    </div>
                </div>

                <!-- Lịch sử trạng thái -->
                <div class="detail-section">
                    <h3>Lịch sử trạng thái</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Thời gian</th>
                                <th>Trạng thái cũ</th>
                                <th>Trạng thái mới</th>
                                <th>Ghi chú</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            if (logs.length === 0) {
                html += `
                    <tr>
                        <td>${ticket.created_at ? new Date(ticket.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '09:00'}</td>
                        <td>Trống</td>
                        <td>${statusText}</td>
                        <td>Tiếp nhận</td>
                    </tr>
                `;
            } else {
                logs.forEach(l => {
                    html += `
                        <tr>
                            <td>${l.changed_at ? new Date(l.changed_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'N/A'}</td>
                            <td>${l.from_status || 'Trống'}</td>
                            <td>${l.to_status}</td>
                            <td>${l.note || 'Thay đổi trạng thái'}</td>
                        </tr>
                    `;
                });
            }

            html += `
                        </tbody>
                    </table>
                </div>

                <div style="margin-top: 16px;">
                    <button class="btn" onclick="window.location.href='ticket-list.html'">[Quay lại danh sách]</button>
                </div>
            `;

            contentArea.innerHTML = html;

        } catch (err) {
            // 4. Trạng thái Lỗi (Error) kèm nút Thử lại
            contentArea.innerHTML = `
                <div class="state-box">
                    <p class="error-msg">Không thể tải thông tin chi tiết phiếu (${err.message})</p>
                    <button class="btn" onclick="loadDetail()">Thử lại</button>
                </div>
            `;
        }
    };

    window.logout = function() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    };

    // Tự động tải dữ liệu
    loadDetail();
</script>
</body>
</html>
